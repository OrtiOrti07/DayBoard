<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="description" content="Tu espacio personal para organizar el día." />
    <link rel="manifest" href="./assets/manifest.json" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/views.css" />
    <title>DayBoard — tu día, a tu ritmo</title>
  </head>
  <body>
    <div class="app-frame">
      <header class="app-header">
        <a class="brand" href="#today" aria-label="DayBoard, ir a Hoy">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>dayboard</span>
        </a>
        <button class="icon-button header-search" data-action="search" aria-label="Buscar" title="Buscar ( / )">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 4.2 4.2"></path></svg>
        </button>
      </header>
      <main id="view" class="view-content" tabindex="-1" aria-live="polite"></main>
      <button id="quick-add" class="quick-add" aria-label="Crear tarea" title="Nueva tarea (N)">
        <span aria-hidden="true">+</span>
      </button>
      <nav class="bottom-nav" aria-label="Navegación principal">
        <a href="#today" class="nav-item" data-route="today" aria-label="Hoy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.2 12 5l8 7.2"></path><path d="M6.5 11v8h11v-8M10 19v-5h4v5"></path></svg><span>Hoy</span>
        </a>
        <a href="#boards" class="nav-item" data-route="boards" aria-label="Tableros">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="6.5" height="15" rx="1.6"></rect><rect x="13.5" y="4.5" width="6.5" height="9" rx="1.6"></rect><path d="M13.5 17h6.5"></path></svg><span>Tableros</span>
        </a>
        <a href="#calendar" class="nav-item" data-route="calendar" aria-label="Calendario">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"></rect><path d="M8 4v4m8-4v4M4 10h16M8 14h2m4 0h2m-8 3h2"></path></svg><span>Agenda</span>
        </a>
        <a href="#habits" class="nav-item" data-route="habits" aria-label="Hábitos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.3-7.5-10a4 4 0 0 1 7.5-1.9A4 4 0 0 1 19.5 10C19.5 15.7 12 20 12 20Z"></path><path d="m9.2 12.3 1.8 1.8 3.8-4"></path></svg><span>Hábitos</span>
        </a>
        <a href="#more" class="nav-item" data-route="more" aria-label="Más opciones">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg><span>Más</span>
        </a>
      </nav>
    </div>
    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
